<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DYCARTER</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         ERA INTRO
         ===================================== -->

    <main class="era-intro">

        <div
            class="star-field"
            aria-hidden="true"
        >

            <div class="forming-star">

                <span class="forming-star-item outer outer-1">★</span>
                <span class="forming-star-item outer outer-2">★</span>
                <span class="forming-star-item outer outer-3">★</span>
                <span class="forming-star-item outer outer-4">★</span>
                <span class="forming-star-item outer outer-5">★</span>

                <span class="forming-star-item inner inner-1">★</span>
                <span class="forming-star-item inner inner-2">★</span>
                <span class="forming-star-item inner inner-3">★</span>
                <span class="forming-star-item inner inner-4">★</span>
                <span class="forming-star-item inner inner-5">★</span>

            </div>


            <span class="star star-top">★</span>
            <span class="star star-left">★</span>
            <span class="star star-right">★</span>
            <span class="star star-bottom">★</span>

        </div>


        <div class="era-title">

            <span>HAPPY</span>
            <span>DYDAY</span>

        </div>

    </main>



    <!-- =====================================
         GLOBAL HEADER
         ===================================== -->

    <header class="site-header">

        <a
            href="./"
            class="site-logo"
        >
            DYCARTER
        </a>


        <button
            class="menu-button"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
        >
            MENU
        </button>

    </header>



    <!-- =====================================
         DYCARTER WORLD
         ===================================== -->

    <main class="dycarter-world">


        <!-- =================================
             FULLSCREEN MENU
             ================================= -->

        <div
            class="menu-overlay"
            aria-hidden="true"
        >

            <div class="menu-header">

                <span class="menu-label">
                    MENU
                </span>


                <button
                    class="menu-close"
                    type="button"
                    aria-label="Close menu"
                >
                    CLOSE
                </button>

            </div>


            <nav class="main-menu">

                <a href="music/">
                    MUSIC
                </a>

                <a href="shop/">
                    SHOP
                </a>

                <a href="books/">
                    BOOKS
                </a>

                <a href="visuals/">
                    VISUALS
                </a>

                <a href="about/">
                    ABOUT
                </a>

                <a href="contact/">
                    CONTACT
                </a>

            </nav>

        </div>



        <!-- =================================
             INTERACTIVE HOME GALLERY
             ================================= -->

        <section class="world-gallery">

            <article class="gallery-item gallery-item-main">

                <div class="gallery-image">

                    <img
                        src="images/IMG_20260817_020133_139.webp"
                        alt="DYCARTER"
                    >

                </div>

            </article>

        </section>


    </main>



    <!-- =====================================
         JAVASCRIPT
         ===================================== -->

    <script src="script.js"></script>

</body>

    </html>
