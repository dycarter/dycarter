<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DYCARTER</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         ERA INTRO
         ===================================== -->

    <main class="era-intro">

        <div
            class="star-field"
            aria-hidden="true"
        >

            <div class="forming-star">

                <span class="forming-star-item outer outer-1">★</span>
                <span class="forming-star-item outer outer-2">★</span>
                <span class="forming-star-item outer outer-3">★</span>
                <span class="forming-star-item outer outer-4">★</span>
                <span class="forming-star-item outer outer-5">★</span>

                <span class="forming-star-item inner inner-1">★</span>
                <span class="forming-star-item inner inner-2">★</span>
                <span class="forming-star-item inner inner-3">★</span>
                <span class="forming-star-item inner inner-4">★</span>
                <span class="forming-star-item inner inner-5">★</span>

            </div>


            <span class="star star-top">★</span>
            <span class="star star-left">★</span>
            <span class="star star-right">★</span>
            <span class="star star-bottom">★</span>

        </div>


        <div class="era-title">

            <span>HAPPY</span>
            <span>DYDAY</span>

        </div>

    </main>



    <!-- =====================================
         DYCARTER WORLD
         ===================================== -->

    <main class="dycarter-world">


        <!-- =================================
             HEADER
             ================================= -->

        <header class="site-header">

            <a
                href="#"
                class="site-logo"
            >
                DYCARTER
            </a>


            <button
                class="menu-button"
                type="button"
                aria-label="Open menu"
                aria-expanded="false"
            >
                MENU
            </button>

        </header>



        <!-- =================================
             FULLSCREEN MENU
             ================================= -->

        <div
            class="menu-overlay"
            aria-hidden="true"
        >

            <div class="menu-header">

                <span class="menu-label">
                    MENU
                </span>


                <button
                    class="menu-close"
                    type="button"
                    aria-label="Close menu"
                >
                    CLOSE
                </button>

            </div>


            <nav class="main-menu">

                <a href="#music">
                    MUSIC
                </a>

                <a href="#shop">
                    SHOP
                </a>

                <a href="#books">
                    BOOKS
                </a>

                <a href="#visuals">
                    VISUALS
                </a>

                <a href="#about">
                    ABOUT
                </a>

                <a href="#contact">
                    CONTACT
                </a>

            </nav>

        </div>



        <!-- =================================
             HERO
             ================================= -->

        <section
            class="world-hero"
            id="visuals"
        >

            <div class="hero-image">

                <img
                    src="images/IMG_20260817_020133_139.webp"
                    alt="DYCARTER"
                >

            </div>


            <div class="hero-overlay"></div>


            <div class="hero-meta">

                <span>DYCARTER</span>
                <span>2026</span>

            </div>


            <div class="hero-scroll">

                <span>
                    SCROLL TO ENTER
                </span>

            </div>

        </section>



        <!-- =================================
             SECTIONS
             ================================= -->

        <section
            class="world-section"
            id="music"
        >
            <span>THE SOUND</span>
        </section>


        <section
            class="world-section"
            id="shop"
        >
            <span>SHOP</span>
        </section>


        <section
            class="world-section"
            id="books"
        >
            <span>THE BOOKS</span>
        </section>


        <section
            class="world-section"
            id="about"
        >
            <span>ABOUT</span>
        </section>


        <section
            class="world-section"
            id="contact"
        >
            <span>CONTACT</span>
        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
