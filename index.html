<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DYCARTER</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         ERA INTRO
         ===================================== -->

    <main class="era-intro">

        <div
            class="star-field"
            aria-hidden="true"
        >

            <div class="forming-star">

                <!-- Outer stars -->

                <span class="forming-star-item outer outer-1">
                    ★
                </span>

                <span class="forming-star-item outer outer-2">
                    ★
                </span>

                <span class="forming-star-item outer outer-3">
                    ★
                </span>

                <span class="forming-star-item outer outer-4">
                    ★
                </span>

                <span class="forming-star-item outer outer-5">
                    ★
                </span>


                <!-- Inner stars -->

                <span class="forming-star-item inner inner-1">
                    ★
                </span>

                <span class="forming-star-item inner inner-2">
                    ★
                </span>

                <span class="forming-star-item inner inner-3">
                    ★
                </span>

                <span class="forming-star-item inner inner-4">
                    ★
                </span>

                <span class="forming-star-item inner inner-5">
                    ★
                </span>

            </div>


            <!-- Final four stars -->

            <span class="star star-top">
                ★
            </span>

            <span class="star star-left">
                ★
            </span>

            <span class="star star-right">
                ★
            </span>

            <span class="star star-bottom">
                ★
            </span>

        </div>


        <!-- Era name -->

        <div class="era-title">

            <span>HAPPY</span>

            <span>DYDAY</span>

        </div>

    </main>



    <!-- =====================================
         DYCARTER WORLD
         ===================================== -->

    <main class="dycarter-world">


        <!-- =================================
             TOP NAVIGATION
             ================================= -->

        <header class="site-header">

            <a
                href="#"
                class="site-logo"
            >
                DYCARTER
            </a>


            <nav class="site-nav">

                <a href="#music">
                    Music
                </a>

                <a href="#shop">
                    Shop
                </a>

                <a href="#books">
                    Books
                </a>

                <a href="#visuals">
                    Visuals
                </a>

                <a href="#about">
                    About
                </a>

                <a href="#contact">
                    Contact
                </a>

            </nav>

        </header>



        <!-- =================================
             HERO / VISUAL WORLD
             ================================= -->

        <section
            class="world-hero"
            id="visuals"
        >

            <div class="hero-image">

                <img
                    src="images/IMG_20260817_020133_139.webp"
                    alt="DYCARTER"
                >

            </div>


            <div class="hero-overlay"></div>


            <div class="hero-meta">

                <span>
                    DYCARTER
                </span>

                <span>
                    2026
                </span>

            </div>


            <div class="hero-scroll">

                <span>
                    SCROLL TO ENTER
                </span>

            </div>

        </section>



        <!-- =================================
             CONTENT PLACEHOLDERS
             ================================= -->

        <section
            class="world-section"
            id="music"
        >

            <span>THE SOUND</span>

        </section>


        <section
            class="world-section"
            id="shop"
        >

            <span>SHOP</span>

        </section>


        <section
            class="world-section"
            id="books"
        >

            <span>THE BOOKS</span>

        </section>


        <section
            class="world-section"
            id="about"
        >

            <span>ABOUT</span>

        </section>


        <section
            class="world-section"
            id="contact"
        >

            <span>CONTACT</span>

        </section>


    </main>



    <script src="script.js"></script>

</body>

</html>
